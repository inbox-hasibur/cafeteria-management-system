services:
  - type: web
    name: lemonlime-cafeteria-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGO_URL
        sync: false  # set manually in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_FRONTEND_URL
        sync: false  # your Vercel URL e.g. https://your-app.vercel.app
      - key: CLOUDINARY_URL
        sync: false
